name: Keep Supabase project active
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send a small request to the Supabase REST API
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          if [ -z "$SUPABASE_API_KEY" ]; then echo "Add the SUPABASE_API_KEY secret first."; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_API_KEY" https://xmcikhjiljbrfixjeswd.supabase.co/rest/v1/)
          echo "Supabase responded with HTTP $code"
          case "$code" in 2*) exit 0;; *) echo "The key was rejected or Supabase did not respond."; exit 1;; esac
